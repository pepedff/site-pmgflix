<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMGFlix — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #04040a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .bg { position: fixed; inset: 0; z-index: 0; }
        .bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 30% 50%, rgba(139,92,246,.1) 0%, transparent 50%), radial-gradient(ellipse at 70% 30%, rgba(109,40,217,.08) 0%, transparent 40%); animation: bgPulse 8s ease-in-out infinite; }
        @keyframes bgPulse { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

        .login-card { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 48px 40px; background: rgba(12,10,22,.85); border: 1px solid rgba(139,92,246,.12); border-radius: 24px; backdrop-filter: blur(20px); box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 120px rgba(139,92,246,.06); }

        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 36px; font-weight: 900; background: linear-gradient(135deg, #c4b5fd, #8B5CF6, #6D28D9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .logo p { color: rgba(255,255,255,.4); font-size: 14px; margin-top: 6px; }

        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.5); margin-bottom: 8px; letter-spacing: .5px; text-transform: uppercase; }
        .field input { width: 100%; padding: 14px 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(139,92,246,.12); border-radius: 12px; color: #fff; font-size: 15px; font-family: inherit; transition: all .3s; outline: none; }
        .field input:focus { border-color: #8B5CF6; background: rgba(139,92,246,.06); box-shadow: 0 0 20px rgba(139,92,246,.12); }
        .field input::placeholder { color: rgba(255,255,255,.2); }

        .btn-login { width: 100%; padding: 15px; background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .3s; margin-top: 8px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(139,92,246,.45); }
        .btn-login:active { transform: scale(.98); }
        .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        .msg { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 14px; display: none; text-align: center; animation: fadeIn .3s; }
        .msg.error { display: block; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }
        .msg.success { display: block; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #4ade80; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        .user-panel { display: none; text-align: center; }
        .user-panel.active { display: block; }
        .user-panel .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #8B5CF6, #6D28D9); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(139,92,246,.3); }
        .user-panel h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .user-panel .plano-badge { display: inline-block; background: linear-gradient(135deg, #8B5CF6, #6D28D9); padding: 5px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin: 8px 0 20px; box-shadow: 0 4px 16px rgba(139,92,246,.3); }
        .user-panel .info { background: rgba(255,255,255,.04); border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: left; }
        .user-panel .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; }
        .user-panel .info-row:last-child { border: none; }
        .user-panel .info-row span:first-child { color: rgba(255,255,255,.4); }
        .btn-logout { width: 100%; padding: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.6); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .3s; font-family: inherit; }
        .btn-logout:hover { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); color: #f87171; }

        .footer-text { text-align: center; margin-top: 24px; font-size: 12px; color: rgba(255,255,255,.2); }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="login-card">
        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="logo">
                <h1>PMGFlix</h1>
                <p>Faça login para acessar</p>
            </div>
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" placeholder="Seu username" autocomplete="username">
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">
            </div>
            <button class="btn-login" id="btnLogin" onclick="doLogin()">Entrar</button>
            <div class="msg" id="msg"></div>
            <p class="footer-text">Não tem conta? Use <strong>!pagar</strong> no Discord</p>
        </div>

        <!-- USER PANEL -->
        <div class="user-panel" id="userPanel">
            <div class="avatar" id="avatarLetter">P</div>
            <h2 id="welcomeName">Usuário</h2>
            <div class="plano-badge" id="planoBadge">Premium</div>
            <div class="info">
                <div class="info-row"><span>Username</span><span id="infoUser">—</span></div>
                <div class="info-row"><span>Plano</span><span id="infoPlano">—</span></div>
                <div class="info-row"><span>Status</span><span style="color:#4ade80">🟢 Ativo</span></div>
                <div class="info-row"><span>Membro desde</span><span id="infoDate">—</span></div>
            </div>
            <button class="btn-logout" onclick="doLogout()">Sair da conta</button>
            <p class="footer-text">PMGFlix © 2026</p>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // Se já está logado, vai direto pro site
        (function checkAuth() {
            try {
                const raw = localStorage.getItem('pmgflix_user');
                if (!raw) return;
                const session = JSON.parse(raw);
                if (session && session.username && localStorage.getItem('pmgflix_token')) {
                    window.location.replace('/PMGFlix.html');
                }
            } catch(e) {
                // Dados corrompidos, limpa e fica no login
                localStorage.removeItem('pmgflix_user');
                localStorage.removeItem('pmgflix_token');
            }
        })();

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btnLogin');

            msg.className = 'msg';
            msg.style.display = 'none';

            if (!username || !password) {
                msg.className = 'msg error';
                msg.textContent = 'Preencha todos os campos.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();

                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ Bem-vindo! Redirecionando...';

                    // Salva sessão + token JWT no localStorage
                    localStorage.setItem('pmgflix_user', JSON.stringify(data.user));
                    localStorage.setItem('pmgflix_token', data.token);

                    // Redireciona para o site com intro
                    setTimeout(() => {
                        window.location.href = '/PMGFlix.html';
                    }, 800);
                } else {
                    msg.className = 'msg error';
                    msg.textContent = '❌ ' + data.message;
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = '❌ Erro de conexão com o servidor.';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        // Enter key
        document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
    </script>
</body>
</html>
