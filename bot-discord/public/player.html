<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMGFlix — Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #04040a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden
        }

        /* LOADING */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(139, 92, 246, .15);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .loading-text {
            font-size: 15px;
            color: rgba(255, 255, 255, .5);
            font-weight: 500
        }

        /* BACK BUTTON */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: all .3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity .3s, background .3s, border-color .3s
        }

        .back-btn.show {
            opacity: 1
        }

        .back-btn:hover {
            background: rgba(139, 92, 246, .3);
            border-color: rgba(139, 92, 246, .4);
            transform: translateX(-2px)
        }

        /* PLAYER WRAPPER */
        .player-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            background: #000;
            border-radius: 0 0 16px 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6)
        }

        .player-wrap.fullscreen {
            max-width: 100%;
            border-radius: 0;
            position: fixed;
            inset: 0;
            z-index: 9999;
            aspect-ratio: auto;
            height: 100vh
        }

        .player-wrap video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            cursor: pointer
        }

        .player-wrap.fullscreen video {
            object-fit: contain
        }

        /* CENTRAL PLAY BUTTON (when paused) */
        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(139, 92, 246, .85);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all .3s;
            box-shadow: 0 8px 32px rgba(139, 92, 246, .5);
            z-index: 5
        }

        .center-play.show {
            display: flex;
            animation: popIn .3s ease
        }

        .center-play:hover {
            background: #8B5CF6;
            transform: translate(-50%, -50%) scale(1.1)
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(.5);
                opacity: 0
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1
            }
        }

        /* DOUBLE-CLICK SEEK INDICATORS */
        .seek-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 18px 26px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 6
        }

        .seek-indicator.left {
            left: 15%
        }

        .seek-indicator.right {
            right: 15%
        }

        .seek-indicator.show {
            animation: seekPulse .8s ease
        }

        @keyframes seekPulse {
            0% {
                opacity: 0;
                transform: translateY(-50%) scale(.7)
            }

            30% {
                opacity: 1;
                transform: translateY(-50%) scale(1)
            }

            100% {
                opacity: 0;
                transform: translateY(-50%) scale(1.1)
            }
        }

        .seek-indicator .arrow {
            font-size: 24px
        }

        /* TOP GRADIENT (title overlay) */
        .player-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 60px 24px 40px;
            background: linear-gradient(180deg, rgba(0, 0, 0, .85), transparent);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 3
        }

        .player-wrap.show-controls .player-top,
        .player-wrap:hover .player-top {
            opacity: 1
        }

        .player-top-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .6)
        }

        .player-top-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, .7);
            margin-top: 2px
        }

        /* CONTROLS */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, .92));
            padding: 30px 20px 14px;
            opacity: 0;
            transition: opacity .3s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 4
        }

        .player-wrap:hover .controls,
        .controls.show {
            opacity: 1
        }

        /* PROGRESS BAR */
        .progress-wrap {
            position: relative;
            padding: 8px 0;
            cursor: pointer
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, .2);
            border-radius: 4px;
            position: relative;
            transition: height .2s
        }

        .progress-wrap:hover .progress-bar {
            height: 7px
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B5CF6, #A78BFA);
            border-radius: 4px;
            position: relative;
            transition: width .1s linear;
            box-shadow: 0 0 10px rgba(139, 92, 246, .5)
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .5), 0 0 0 3px rgba(139, 92, 246, .4)
        }

        .progress-wrap:hover .progress-fill::after {
            transform: translateY(-50%) scale(1)
        }

        .buffered {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255, 255, 255, .15);
            border-radius: 4px;
            pointer-events: none;
            transition: width .3s
        }

        /* HOVER TIME PREVIEW */
        .time-preview {
            position: absolute;
            bottom: 24px;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s;
            font-variant-numeric: tabular-nums;
            border: 1px solid rgba(139, 92, 246, .3)
        }

        .time-preview.show {
            opacity: 1
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px
        }

        .ctrl-left,
        .ctrl-right {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            transition: transform .2s, color .2s, background .2s;
            line-height: 1;
            border-radius: 8px;
            position: relative
        }

        .ctrl-btn:hover {
            transform: scale(1.15);
            color: #A78BFA;
            background: rgba(255, 255, 255, .06)
        }

        .ctrl-btn.active {
            color: #A78BFA
        }

        /* TOOLTIPS */
        .ctrl-btn[data-tip]:hover::before {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .9);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid rgba(139, 92, 246, .3);
            pointer-events: none
        }

        .time {
            font-size: 13px;
            color: rgba(255, 255, 255, .85);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-weight: 500
        }

        /* VOLUME */
        .vol-wrap {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .vol-bar {
            width: 0;
            height: 4px;
            background: rgba(255, 255, 255, .2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: width .3s ease
        }

        .vol-wrap:hover .vol-bar,
        .vol-bar.show {
            width: 80px
        }

        .vol-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B5CF6, #A78BFA);
            border-radius: 3px;
            transition: width .1s
        }

        /* SPEED MENU */
        .menu-wrap {
            position: relative
        }

        .menu {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            background: rgba(15, 10, 30, .95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, .2);
            border-radius: 10px;
            padding: 6px;
            min-width: 140px;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: all .2s;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .5)
        }

        .menu.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto
        }

        .menu-item {
            padding: 8px 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, .8);
            cursor: pointer;
            border-radius: 6px;
            transition: all .15s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .menu-item:hover {
            background: rgba(139, 92, 246, .15);
            color: #fff
        }

        .menu-item.active {
            color: #A78BFA;
            background: rgba(139, 92, 246, .1)
        }

        .menu-item.active::after {
            content: '✓';
            font-weight: 700
        }

        /* CONTENT INFO */
        .content-info {
            max-width: 1280px;
            margin: 28px auto;
            padding: 0 24px
        }

        .content-info h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .content-info .meta {
            display: flex;
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, .6);
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center
        }

        .meta-tag {
            padding: 4px 10px;
            background: rgba(139, 92, 246, .1);
            border: 1px solid rgba(139, 92, 246, .2);
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            color: #A78BFA;
            text-transform: capitalize
        }

        .meta-tag.gold {
            background: rgba(251, 191, 36, .1);
            border-color: rgba(251, 191, 36, .25);
            color: #fbbf24
        }

        .meta-tag.early {
            background: linear-gradient(135deg, rgba(139, 92, 246, .2), rgba(109, 40, 217, .15));
            border-color: rgba(139, 92, 246, .3);
            color: #c4b5fd
        }

        .content-info .desc {
            font-size: 15px;
            line-height: 1.75;
            color: rgba(255, 255, 255, .65);
            max-width: 780px
        }

        /* ACTION BUTTONS */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap
        }

        .action-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit
        }

        .action-btn:hover {
            background: rgba(139, 92, 246, .15);
            border-color: rgba(139, 92, 246, .3)
        }

        .action-btn.active {
            background: rgba(139, 92, 246, .2);
            border-color: #8B5CF6;
            color: #fff
        }

        /* EPISODES */
        .episodes {
            max-width: 1280px;
            margin: 36px auto;
            padding: 0 24px
        }

        .episodes h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .season-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            padding: 6px;
            background: rgba(255, 255, 255, .02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .04);
            width: fit-content
        }

        .season-tab {
            padding: 9px 20px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, .5);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all .2s;
            font-family: inherit
        }

        .season-tab:hover {
            color: rgba(255, 255, 255, .8)
        }

        .season-tab.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, .2), rgba(109, 40, 217, .15));
            color: #fff;
            box-shadow: 0 2px 8px rgba(139, 92, 246, .2)
        }

        .ep-list {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .ep-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, .025);
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 14px;
            cursor: pointer;
            transition: all .3s;
            position: relative;
            overflow: hidden
        }

        .ep-card:hover {
            background: rgba(139, 92, 246, .06);
            border-color: rgba(139, 92, 246, .2);
            transform: translateX(4px)
        }

        .ep-card.active {
            border-color: #8B5CF6;
            background: rgba(139, 92, 246, .1);
            box-shadow: 0 4px 16px rgba(139, 92, 246, .15)
        }

        .ep-card.watched::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #A78BFA
        }

        .ep-num {
            font-size: 28px;
            font-weight: 800;
            color: rgba(139, 92, 246, .5);
            min-width: 42px;
            text-align: center;
            font-variant-numeric: tabular-nums
        }

        .ep-card.active .ep-num {
            color: #A78BFA
        }

        .ep-info {
            flex: 1;
            min-width: 0
        }

        .ep-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ep-info p {
            font-size: 13px;
            color: rgba(255, 255, 255, .45);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical
        }

        .ep-progress {
            height: 3px;
            background: rgba(255, 255, 255, .08);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden
        }

        .ep-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B5CF6, #A78BFA);
            border-radius: 2px
        }

        .ep-play {
            font-size: 18px;
            opacity: .4;
            transition: all .2s;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, .1)
        }

        .ep-card:hover .ep-play {
            opacity: 1;
            background: rgba(139, 92, 246, .25);
            transform: scale(1.1)
        }

        .ep-watched-badge {
            font-size: 10px;
            color: #A78BFA;
            background: rgba(139, 92, 246, .15);
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        /* NEXT EPISODE BUTTON */
        .next-ep-btn {
            display: none;
            position: absolute;
            bottom: 90px;
            right: 24px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            z-index: 10;
            font-family: inherit;
            transition: all .3s;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, .5);
            display: none;
            align-items: center;
            gap: 8px
        }

        .next-ep-btn.show {
            display: inline-flex;
            animation: slideInRight .4s ease
        }

        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .next-ep-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(139, 92, 246, .7)
        }

        .next-ep-countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, .3);
            border-radius: 50%;
            font-size: 12px;
            font-weight: 800
        }

        /* END SCREEN */
        .end-screen {
            position: absolute;
            inset: 0;
            background: rgba(4, 4, 10, .85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 7
        }

        .end-screen.show {
            display: flex
        }

        .end-screen h2 {
            font-size: 24px;
            font-weight: 700;
            color: #fff
        }

        .end-screen-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center
        }

        .end-btn {
            padding: 13px 26px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            display: inline-flex;
            align-items: center;
            gap: 8px
        }

        .end-btn-primary {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, .4)
        }

        .end-btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(139, 92, 246, .6)
        }

        .end-btn-secondary {
            background: rgba(255, 255, 255, .08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .15)
        }

        .end-btn-secondary:hover {
            background: rgba(255, 255, 255, .12)
        }

        /* ERROR SCREEN */
        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 16px;
            text-align: center;
            padding: 20px
        }

        .error-icon {
            font-size: 64px;
            opacity: .6
        }

        .error-text {
            font-size: 18px;
            color: rgba(255, 255, 255, .7);
            max-width: 500px
        }

        .error-btn {
            margin-top: 12px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px
        }

        @media(max-width:768px) {

            .content-info,
            .episodes {
                padding: 0 16px
            }

            .content-info h1 {
                font-size: 22px
            }

            .player-wrap {
                border-radius: 0
            }

            .ctrl-left,
            .ctrl-right {
                gap: 8px
            }

            .ctrl-btn {
                font-size: 18px
            }

            .time {
                font-size: 11px
            }

            .vol-bar {
                display: none
            }

            .center-play {
                width: 68px;
                height: 68px;
                font-size: 28px
            }

            .seek-indicator {
                padding: 14px 18px
            }
        }
    </style>
</head>

<body>
    <a class="back-btn" id="backBtn" href="/PMGFlix.html">← Voltar</a>

    <div class="loading" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Preparando seu conteúdo...</div>
    </div>

    <div id="playerPage" style="display:none">
        <div class="player-wrap" id="playerWrap">
            <video id="video" preload="auto"></video>

            <!-- Top title overlay -->
            <div class="player-top">
                <div class="player-top-title" id="topTitle"></div>
                <div class="player-top-sub" id="topSub"></div>
            </div>

            <!-- Center play button -->
            <button class="center-play" id="centerPlay" onclick="togglePlay()">▶</button>

            <!-- Seek indicators -->
            <div class="seek-indicator left" id="seekLeft">
                <div class="arrow">⏪</div>
                <div>-10s</div>
            </div>
            <div class="seek-indicator right" id="seekRight">
                <div class="arrow">⏩</div>
                <div>+10s</div>
            </div>

            <!-- Next episode button -->
            <button class="next-ep-btn" id="nextEpBtn" onclick="playNextEp()">
                Próximo Episódio
                <span class="next-ep-countdown" id="nextCount">10</span>
            </button>

            <!-- End screen -->
            <div class="end-screen" id="endScreen">
                <h2 id="endTitle">Você assistiu até o fim! 🎉</h2>
                <div class="end-screen-actions">
                    <button class="end-btn end-btn-primary" onclick="replay()">🔄 Assistir novamente</button>
                    <button class="end-btn end-btn-secondary" id="endNextBtn" onclick="playNextEp()"
                        style="display:none">▶ Próximo episódio</button>
                    <button class="end-btn end-btn-secondary" onclick="window.location.href='/PMGFlix.html'">🏠 Voltar
                        ao início</button>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls" id="controls">
                <div class="progress-wrap" id="progressWrap">
                    <div class="time-preview" id="timePreview">0:00</div>
                    <div class="progress-bar">
                        <div class="buffered" id="buffered"></div>
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-left">
                        <button class="ctrl-btn" id="playBtn" onclick="togglePlay()"
                            data-tip="Play/Pause (Espaço)">▶</button>
                        <button class="ctrl-btn" onclick="skip(-10)" data-tip="-10s (←)">⏪</button>
                        <button class="ctrl-btn" onclick="skip(10)" data-tip="+10s (→)">⏩</button>
                        <div class="vol-wrap">
                            <button class="ctrl-btn" id="volBtn" onclick="toggleMute()" data-tip="Mudo (M)">🔊</button>
                            <div class="vol-bar" id="volBar">
                                <div class="vol-fill" id="volFill" style="width:100%"></div>
                            </div>
                        </div>
                        <span class="time" id="timeDisplay">0:00 / 0:00</span>
                    </div>
                    <div class="ctrl-right">
                        <div class="menu-wrap">
                            <button class="ctrl-btn" id="speedBtn" onclick="toggleMenu('speed')"
                                data-tip="Velocidade">⚡</button>
                            <div class="menu" id="speedMenu">
                                <div class="menu-item" onclick="setSpeed(0.5)">0.5x</div>
                                <div class="menu-item" onclick="setSpeed(0.75)">0.75x</div>
                                <div class="menu-item active" onclick="setSpeed(1)">Normal</div>
                                <div class="menu-item" onclick="setSpeed(1.25)">1.25x</div>
                                <div class="menu-item" onclick="setSpeed(1.5)">1.5x</div>
                                <div class="menu-item" onclick="setSpeed(2)">2x</div>
                            </div>
                        </div>
                        <button class="ctrl-btn" id="subBtn" onclick="toggleSub()" data-tip="Legendas (C)"
                            style="display:none">💬</button>
                        <button class="ctrl-btn" onclick="togglePiP()" data-tip="Picture in Picture">🗗</button>
                        <button class="ctrl-btn" id="fsBtn" onclick="toggleFS()" data-tip="Tela cheia (F)">⛶</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-info" id="contentInfo"></div>
        <div class="episodes" id="episodesSection" style="display:none"></div>
    </div>

    <script>
        const API = window.location.origin;
        const TOKEN = () => localStorage.getItem('pmgflix_token');
        function apiFetch(url, opts = {}) { return fetch(API + url, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN(), ...opts.headers } }).then(r => r.json()) }
        if (!TOKEN()) { window.location.href = '/'; }

        const params = new URLSearchParams(location.search);
        const contentId = params.get('id');
        const episodeId = params.get('ep');
        let content = null, currentEpId = null, seasons = [], watchedEps = new Set(), epProgress = {};
        let autoNextTimer = null, autoNextCountdown = 10;

        const video = document.getElementById('video');
        const playBtn = document.getElementById('playBtn');
        const centerPlay = document.getElementById('centerPlay');
        const progressFill = document.getElementById('progressFill');
        const buffered = document.getElementById('buffered');
        const progressWrap = document.getElementById('progressWrap');
        const timeDisplay = document.getElementById('timeDisplay');
        const timePreview = document.getElementById('timePreview');
        const volFill = document.getElementById('volFill');
        const volBar = document.getElementById('volBar');
        const playerWrap = document.getElementById('playerWrap');

        // ── INIT ────────────────────────────────────────
        async function init() {
            if (!contentId) { showError('Conteúdo não encontrado', '📭'); return }
            try {
                content = await apiFetch('/contents/' + contentId);
                if (!content || content.error) { showError(content?.error || 'Conteúdo não disponível', '⚠️'); return }
                if (!content.accessible) { showError(content.reason, '🔒'); return }

                document.title = content.title + ' — PMGFlix';
                document.getElementById('topTitle').textContent = content.title;
                renderContentInfo();

                if (content.type === 'filme') {
                    await startWatch(contentId, null, content.video_url, content.subtitle_url);
                } else {
                    seasons = content.seasons || [];
                    renderEpisodes();
                    const epToPlay = episodeId || seasons[0]?.episodes?.[0]?.id;
                    if (epToPlay) playEpisode(epToPlay);
                }

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('playerPage').style.display = 'block';
                document.getElementById('backBtn').classList.add('show');
            } catch (e) { showError('Erro ao carregar conteúdo', '⚠️') }
        }

        function showError(msg, icon) {
            document.getElementById('loadingScreen').innerHTML = `
        <div class="error-screen">
            <div class="error-icon">${icon}</div>
            <div class="error-text">${msg}</div>
            <button class="error-btn" onclick="window.location.href='/PMGFlix.html'">← Voltar ao início</button>
        </div>
    `;
        }

        function renderContentInfo() {
            const planBadge = content.required_plan !== 'gratis' ? `<span class="meta-tag gold">⭐ ${content.required_plan.toUpperCase()}</span>` : '';
            const earlyBadge = content.early_access ? '<span class="meta-tag early">🔮 Acesso antecipado</span>' : '';
            document.getElementById('contentInfo').innerHTML = `
        <h1>${content.title}</h1>
        <div class="meta">
            <span class="meta-tag">${content.type}</span>
            ${content.category ? `<span class="meta-tag">${content.category}</span>` : ''}
            ${planBadge}
            ${earlyBadge}
        </div>
        <p class="desc">${content.description || 'Sem descrição disponível.'}</p>
        <div class="action-row">
            <button class="action-btn" onclick="copyLink()">🔗 Copiar link</button>
            <button class="action-btn" onclick="toggleSub()">💬 Legendas</button>
        </div>
    `;
        }

        async function startWatch(cid, eid, videoUrl, subUrl) {
            const res = await apiFetch('/watch/start', { method: 'POST', body: JSON.stringify({ content_id: parseInt(cid), episode_id: eid ? parseInt(eid) : null }) });
            if (!res.allowed) { showError(res.reason || 'Acesso negado', '🔒'); return }
            video.src = res.videoUrl || videoUrl;
            currentEpId = eid;

            // Update top subtitle for episodes
            if (eid) {
                const ep = findEpisode(eid);
                if (ep) document.getElementById('topSub').textContent = `T${ep._seasonNum} • E${ep.episode_number} • ${ep.title}`;
            } else {
                document.getElementById('topSub').textContent = content.category || '';
            }

            // Subtitles
            video.querySelectorAll('track').forEach(t => t.remove());
            const sub = res.subtitleUrl || subUrl;
            if (sub) {
                const track = document.createElement('track');
                track.kind = 'subtitles'; track.label = 'Português'; track.srclang = 'pt'; track.src = sub; track.default = true;
                video.appendChild(track);
                document.getElementById('subBtn').style.display = 'inline';
            } else {
                document.getElementById('subBtn').style.display = 'none';
            }

            // Restore progress
            if (res.progress && res.progress.progress_seconds > 5 && !res.progress.completed) {
                video.currentTime = res.progress.progress_seconds;
            }

            document.getElementById('endScreen').classList.remove('show');
            video.play().catch(() => { centerPlay.classList.add('show') });
            playBtn.textContent = '⏸';
            centerPlay.textContent = '⏸';
        }

        function findEpisode(epId) {
            for (const s of seasons) {
                for (const e of (s.episodes || [])) {
                    if (e.id == epId) { e._seasonNum = s.season_number; return e }
                }
            }
            return null;
        }

        function playEpisode(epId) {
            const ep = findEpisode(epId);
            if (!ep) return;
            startWatch(contentId, epId, ep.video_url, ep.subtitle_url);
            document.querySelectorAll('.ep-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.ep-card[data-id="${epId}"]`);
            if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }) }
            history.replaceState(null, '', `/player.html?id=${contentId}&ep=${epId}`);
            document.getElementById('nextEpBtn').classList.remove('show');
            clearAutoNext();
        }

        function renderEpisodes() {
            const sec = document.getElementById('episodesSection');
            sec.style.display = 'block';
            let html = '<h2>📺 Episódios</h2><div class="season-tabs">';
            seasons.forEach((s, i) => {
                html += `<button class="season-tab ${i === 0 ? 'active' : ''}" onclick="showSeason(${i},this)">${s.title || 'Temporada ' + s.season_number}</button>`;
            });
            html += '</div>';
            seasons.forEach((s, i) => {
                html += `<div class="ep-list season-list" data-season="${i}" style="${i > 0 ? 'display:none' : ''}">`;
                (s.episodes || []).forEach(ep => {
                    const isActive = currentEpId == ep.id;
                    html += `<div class="ep-card ${isActive ? 'active' : ''}" data-id="${ep.id}" onclick="playEpisode(${ep.id})">
                <div class="ep-num">${String(ep.episode_number).padStart(2, '0')}</div>
                <div class="ep-info">
                    <h3>${ep.title}</h3>
                    <p>${ep.description || 'Sem descrição'}</p>
                </div>
                <div class="ep-play">▶</div>
            </div>`;
                });
                html += '</div>';
            });
            sec.innerHTML = html;
        }

        function showSeason(idx, btn) {
            document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.season-list').forEach(l => l.style.display = 'none');
            document.querySelector(`.season-list[data-season="${idx}"]`).style.display = 'flex';
        }

        // ── PLAYER CONTROLS ────────────────────────────
        function togglePlay() {
            if (video.paused) {
                video.play();
                playBtn.textContent = '⏸';
                centerPlay.classList.remove('show');
            } else {
                video.pause();
                playBtn.textContent = '▶';
                centerPlay.textContent = '▶';
                centerPlay.classList.add('show');
            }
        }

        function skip(s) {
            video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + s));
            const ind = document.getElementById(s < 0 ? 'seekLeft' : 'seekRight');
            ind.classList.remove('show');
            void ind.offsetWidth;
            ind.classList.add('show');
        }

        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById('volBtn').textContent = video.muted ? '🔇' : (video.volume > .5 ? '🔊' : '🔉');
        }

        function setSpeed(s) {
            video.playbackRate = s;
            document.querySelectorAll('#speedMenu .menu-item').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('speedMenu').classList.remove('show');
        }

        function toggleMenu(name) {
            const menu = document.getElementById(name + 'Menu');
            document.querySelectorAll('.menu').forEach(m => { if (m !== menu) m.classList.remove('show') });
            menu.classList.toggle('show');
            event.stopPropagation();
        }
        document.addEventListener('click', () => document.querySelectorAll('.menu').forEach(m => m.classList.remove('show')));

        function toggleSub() {
            const tracks = video.textTracks;
            if (!tracks.length) { return }
            const showing = tracks[0].mode === 'showing';
            tracks[0].mode = showing ? 'hidden' : 'showing';
            document.getElementById('subBtn').classList.toggle('active', !showing);
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else await video.requestPictureInPicture();
            } catch (e) { }
        }

        function toggleFS() {
            if (!document.fullscreenElement) { playerWrap.requestFullscreen?.(); playerWrap.classList.add('fullscreen') }
            else { document.exitFullscreen?.(); playerWrap.classList.remove('fullscreen') }
        }
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) playerWrap.classList.remove('fullscreen');
            document.getElementById('fsBtn').textContent = document.fullscreenElement ? '⛶' : '⛶';
        });

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            const btn = event.target;
            const txt = btn.textContent;
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = txt, 2000);
        }

        function replay() {
            video.currentTime = 0;
            document.getElementById('endScreen').classList.remove('show');
            video.play();
            playBtn.textContent = '⏸';
        }

        // ── VIDEO EVENTS ───────────────────────────────
        video.addEventListener('timeupdate', () => {
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = pct + '%';
            timeDisplay.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);

            // Show next episode button when 95% complete on series
            if (content?.type !== 'filme' && currentEpId && pct > 95 && !autoNextTimer) {
                const next = findNextEpisode();
                if (next) {
                    document.getElementById('nextEpBtn').classList.add('show');
                    startAutoNext();
                }
            }
        });

        video.addEventListener('progress', () => {
            if (video.buffered.length && video.duration) {
                const end = video.buffered.end(video.buffered.length - 1);
                buffered.style.width = (end / video.duration * 100) + '%';
            }
        });

        video.addEventListener('play', () => { playBtn.textContent = '⏸'; centerPlay.classList.remove('show') });
        video.addEventListener('pause', () => { playBtn.textContent = '▶'; centerPlay.textContent = '▶'; if (!video.ended) centerPlay.classList.add('show') });
        video.addEventListener('click', togglePlay);

        video.addEventListener('volumechange', () => {
            volFill.style.width = (video.muted ? 0 : video.volume * 100) + '%';
            document.getElementById('volBtn').textContent = video.muted || video.volume === 0 ? '🔇' : (video.volume > .5 ? '🔊' : '🔉');
        });

        // Double-click to fullscreen, but also handle double-click seek on sides
        let lastTap = 0;
        video.addEventListener('dblclick', (e) => {
            const rect = video.getBoundingClientRect();
            const x = e.clientX - rect.left;
            if (x < rect.width * 0.3) skip(-10);
            else if (x > rect.width * 0.7) skip(10);
            else toggleFS();
        });

        // Progress bar interaction
        progressWrap.addEventListener('click', e => {
            const r = progressWrap.getBoundingClientRect();
            const pct = (e.clientX - r.left) / r.width;
            if (video.duration) video.currentTime = pct * video.duration;
        });
        progressWrap.addEventListener('mousemove', e => {
            if (!video.duration) return;
            const r = progressWrap.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
            timePreview.style.left = (pct * 100) + '%';
            timePreview.textContent = fmt(pct * video.duration);
            timePreview.classList.add('show');
        });
        progressWrap.addEventListener('mouseleave', () => timePreview.classList.remove('show'));

        volBar.addEventListener('click', e => {
            const r = volBar.getBoundingClientRect();
            video.volume = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
            video.muted = false;
        });

        // ── PROGRESS SAVING ────────────────────────────
        setInterval(() => {
            if (!video.paused && video.duration && contentId) {
                apiFetch('/watch/progress', {
                    method: 'PATCH', body: JSON.stringify({
                        content_id: parseInt(contentId), episode_id: currentEpId ? parseInt(currentEpId) : null,
                        progress_seconds: video.currentTime, progress_percent: (video.currentTime / video.duration) * 100, completed: false
                    })
                }).catch(() => { });
            }
        }, 5000);

        // ── END HANDLING ───────────────────────────────
        video.addEventListener('ended', () => {
            playBtn.textContent = '▶';
            apiFetch('/watch/progress', {
                method: 'PATCH', body: JSON.stringify({
                    content_id: parseInt(contentId), episode_id: currentEpId ? parseInt(currentEpId) : null,
                    progress_seconds: video.duration, progress_percent: 100, completed: true
                })
            }).catch(() => { });

            const next = content?.type !== 'filme' ? findNextEpisode() : null;
            if (next) {
                document.getElementById('endNextBtn').style.display = 'inline-flex';
                document.getElementById('endTitle').textContent = 'Episódio concluído! 🎉';
            } else {
                document.getElementById('endNextBtn').style.display = 'none';
                document.getElementById('endTitle').textContent = 'Você assistiu até o fim! 🎉';
            }
            document.getElementById('endScreen').classList.add('show');
            clearAutoNext();
        });

        function findNextEpisode() {
            let found = false;
            for (const s of seasons) {
                for (const e of (s.episodes || [])) {
                    if (found) return e;
                    if (e.id == currentEpId) found = true;
                }
            }
            return null;
        }

        function startAutoNext() {
            autoNextCountdown = 10;
            document.getElementById('nextCount').textContent = autoNextCountdown;
            autoNextTimer = setInterval(() => {
                autoNextCountdown--;
                document.getElementById('nextCount').textContent = autoNextCountdown;
                if (autoNextCountdown <= 0) { clearAutoNext(); playNextEp() }
            }, 1000);
        }

        function clearAutoNext() {
            if (autoNextTimer) { clearInterval(autoNextTimer); autoNextTimer = null }
        }

        function playNextEp() {
            clearAutoNext();
            const next = findNextEpisode();
            if (next) {
                document.getElementById('nextEpBtn').classList.remove('show');
                document.getElementById('endScreen').classList.remove('show');
                playEpisode(next.id);
            }
        }

        function fmt(s) {
            if (!isFinite(s)) return '0:00';
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
            return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
        }

        // ── KEYBOARD SHORTCUTS ─────────────────────────
        document.addEventListener('keydown', e => {
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
            switch (e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': skip(-10); break;
                case 'ArrowRight': skip(10); break;
                case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + .1); break;
                case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - .1); break;
                case 'KeyF': toggleFS(); break;
                case 'KeyM': toggleMute(); break;
                case 'KeyC': toggleSub(); break;
                case 'KeyP': togglePiP(); break;
                case 'Digit0': case 'Numpad0': video.currentTime = 0; break;
            }
            // Number keys 1-9 jump to %
            if (e.code.startsWith('Digit') || e.code.startsWith('Numpad')) {
                const n = parseInt(e.key);
                if (n >= 1 && n <= 9 && video.duration) video.currentTime = video.duration * (n / 10);
            }
        });

        // ── HIDE CONTROLS ──────────────────────────────
        let hideTimer;
        function showControls() {
            document.getElementById('controls').classList.add('show');
            playerWrap.classList.add('show-controls');
            playerWrap.style.cursor = 'default';
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if (!video.paused) {
                    document.getElementById('controls').classList.remove('show');
                    playerWrap.classList.remove('show-controls');
                    playerWrap.style.cursor = 'none';
                }
            }, 3000);
        }
        playerWrap.addEventListener('mousemove', showControls);
        playerWrap.addEventListener('mouseleave', () => {
            if (!video.paused) {
                document.getElementById('controls').classList.remove('show');
                playerWrap.classList.remove('show-controls');
            }
        });

        init();
    </script>
</body>

</html>
